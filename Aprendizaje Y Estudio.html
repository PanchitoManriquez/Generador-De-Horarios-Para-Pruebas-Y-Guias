<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Horarios de Pruebas</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --text-color: #c5c6c7;
            --neon-blue: #45f3ff;
            --neon-pink: #ff2a7a;
            --neon-orange: #ffaa00;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .rainbow-text {
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow-anim 5s linear infinite;
            background-size: 400% 100%;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255,255,255,0.2);
            font-size: 1.5rem;
        }

        @keyframes rainbow-anim {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .container {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 0 15px var(--neon-blue);
            border: 2px solid var(--neon-pink);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        input[type="text"], input[type="date"] {
            padding: 10px;
            background: #111;
            border: 1px solid var(--neon-blue);
            color: white;
            font-family: 'Orbitron', sans-serif;
            border-radius: 5px;
            flex: 1;
            min-width: 200px;
        }

        button {
            background: transparent;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            border: 2px solid;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-add { border-color: #00ff00; color: #00ff00; }
        .btn-add:hover { background: #00ff00; color: #000; box-shadow: 0 0 15px #00ff00; }

        .btn-generate { border-color: var(--neon-pink); color: var(--neon-pink); width: 100%; margin-bottom: 15px;}
        .btn-generate:hover { background: var(--neon-pink); color: #fff; box-shadow: 0 0 15px var(--neon-pink); }

        .botones-descarga {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-png { border-color: var(--neon-orange); color: var(--neon-orange); flex: 1; min-width: 140px;}
        .btn-png:hover { background: var(--neon-orange); color: #000; box-shadow: 0 0 15px var(--neon-orange); }

        .btn-download { border-color: var(--neon-blue); color: var(--neon-blue); flex: 1; min-width: 140px;}
        .btn-download:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }

        .lista-pruebas {
            list-style: none;
            padding: 0;
            margin-bottom: 20px;
        }

        .lista-pruebas li {
            background: #222;
            margin: 5px 0;
            padding: 10px;
            border-left: 4px solid var(--neon-pink);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-delete {
            border: 1px solid red;
            color: red;
            padding: 5px 10px;
            font-size: 12px;
        }

        /* Área del Horario Generado */
        #horario-final {
            display: none;
            background: #ffffff; /* Fondo blanco garantizado */
            color: #000;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 800px;
            margin-top: 20px;
            border: 5px solid transparent;
            border-image: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet) 1;
            box-sizing: border-box;
        }

        .grid-horario {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .dia {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            min-height: 150px;
            border-top: 4px solid #333;
        }

        .dia h3 {
            text-align: center;
            margin-top: 0;
            font-size: 14px;
            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
        }

        .prueba-item {
            background: var(--neon-blue);
            color: #000;
            padding: 5px;
            margin: 5px 0;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Celular Responsive */
        @media (max-width: 600px) {
            .grid-horario {
                grid-template-columns: 1fr;
            }
            .dia { min-height: auto; }
        }
    </style>
</head>
<body>

    <h1 class="rainbow-text">Generador de Horarios</h1>

    <div class="container">
        <h3>1. Ingresa tus Evaluaciones</h3>
        <div class="input-group">
            <input type="text" id="nombrePrueba" placeholder="Nombre de la prueba">
            <input type="date" id="fechaPrueba">
            <button class="btn-add" onclick="agregarPrueba()">Añadir</button>
        </div>

        <ul class="lista-pruebas" id="lista"></ul>

        <h3>2. Opciones</h3>
        <button class="btn-generate" onclick="generarHorario()">Generar Horario</button>
        
        <div class="botones-descarga">
            <button class="btn-png" onclick="descargarPNG()">Descargar PNG</button>
            <button class="btn-download" onclick="descargarPDF()">Descargar PDF</button>
        </div>
    </div>

    <div id="horario-final">
        <h2 style="text-align: center; font-family: sans-serif; text-transform: uppercase;">Mi Horario de Estudio</h2>
        <div class="grid-horario">
            <div class="dia" id="dia-1"><h3>Lunes</h3></div>
            <div class="dia" id="dia-2"><h3>Martes</h3></div>
            <div class="dia" id="dia-3"><h3>Miércoles</h3></div>
            <div class="dia" id="dia-4"><h3>Jueves</h3></div>
            <div class="dia" id="dia-5"><h3>Viernes</h3></div>
        </div>
    </div>

    <script>
        let pruebas = [];

        function agregarPrueba() {
            const nombre = document.getElementById('nombrePrueba').value;
            const fecha = document.getElementById('fechaPrueba').value;

            if (nombre === '' || fecha === '') {
                alert('Ingresa el nombre y la fecha.');
                return;
            }

            pruebas.push({ nombre, fecha });
            document.getElementById('nombrePrueba').value = '';
            document.getElementById('fechaPrueba').value = '';
            actualizarLista();
        }

        function eliminarPrueba(index) {
            pruebas.splice(index, 1);
            actualizarLista();
        }

        function actualizarLista() {
            const lista = document.getElementById('lista');
            lista.innerHTML = '';
            pruebas.forEach((prueba, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${prueba.nombre} - <strong>${prueba.fecha}</strong></span>
                                <button class="btn-delete" onclick="eliminarPrueba(${index})">X</button>`;
                lista.appendChild(li);
            });
        }

        function generarHorario() {
            if(pruebas.length === 0) {
                alert("Añade al menos una prueba primero.");
                return;
            }

            for(let i=1; i<=5; i++) {
                document.getElementById(`dia-${i}`).innerHTML = `<h3>${['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'][i-1]}</h3>`;
            }

            pruebas.forEach(prueba => {
                const fechaObj = new Date(prueba.fecha + 'T12:00:00'); 
                let diaSemana = fechaObj.getDay();
                if(diaSemana === 0 || diaSemana === 6) diaSemana = 5; 

                const divPrueba = document.createElement('div');
                divPrueba.className = 'prueba-item';
                divPrueba.textContent = `${prueba.nombre} (${prueba.fecha})`;
                document.getElementById(`dia-${diaSemana}`).appendChild(divPrueba);
            });

            document.getElementById('horario-final').style.display = 'block';
            document.getElementById('horario-final').scrollIntoView({ behavior: 'smooth' });
        }

        // --- FUNCIONES DE DESCARGA MEJORADAS --- //

        // Prepara el cuadro temporalmente (esencial para celulares)
        function prepararParaCaptura(horario) {
            const bordeOriginal = horario.style.borderImage;
            horario.style.borderImage = 'none';
            horario.style.border = '5px solid #1f2833'; 
            window.scrollTo(0, horario.offsetTop); // Asegura que esté en pantalla
            return bordeOriginal;
        }

        function descargarPNG() {
            const horario = document.getElementById('horario-final');
            if (horario.style.display === 'none' || horario.style.display === '') {
                alert('Primero debes generar el horario.'); return;
            }

            const bordeOriginal = prepararParaCaptura(horario);

            html2canvas(horario, { scale: 2, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Mi_Horario_De_Pruebas.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                horario.style.borderImage = bordeOriginal;
                horario.style.border = '';
            });
        }

        function descargarPDF() {
            const horario = document.getElementById('horario-final');
            if (horario.style.display === 'none' || horario.style.display === '') {
                alert('Primero debes generar el horario.'); return;
            }

            const bordeOriginal = prepararParaCaptura(horario);

            var opt = {
                margin:       0.2,
                filename:     'Mi_Horario_De_Pruebas.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, scrollY: 0, backgroundColor: '#ffffff' },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
            };

            html2pdf().set(opt).from(horario).save().then(() => {
                horario.style.borderImage = bordeOriginal;
                horario.style.border = '';
            });
        }
    </script>
</body>
</html>
